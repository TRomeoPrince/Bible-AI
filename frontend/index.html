<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible-AI</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Bible-AI</h1>
      <p>Scripture study with source-aware retrieval.</p>
    </header>

    <section class="card">
      <form id="lookup-form">
        <label for="reference">Bible reference</label>
        <div class="row">
          <input id="reference" value="John 3:3" placeholder="John 3:3">
          <select id="translation"></select>
          <button type="submit">Lookup</button>
        </div>
      </form>
    </section>

    <section id="status" class="status"></section>

    <section id="scripture" class="card hidden">
      <div class="section-label">SCRIPTURE</div>
      <h2 id="passage-title"></h2>
      <div id="passage-text"></div>
      <p id="attribution" class="muted"></p>
    </section>

    <section class="card">
      <div class="section-label">STUDY NOTE</div>
      <textarea id="note" rows="5" placeholder="Write a note about this passage..."></textarea>
      <button id="save-note" type="button">Save note</button>
    </section>

    <section class="card">
      <div class="section-label">TRANSLATIONS</div>
      <div id="translations-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
